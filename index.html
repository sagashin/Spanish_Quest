<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vamos! Quest — 13歳からのスペイン語冒険クエスト 🇪🇸⚽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            spainRed: '#e11d48',
            spainGold: '#fbbf24'
          }
        }
      }
    };
  </script>
  <!-- Custom Sporty Game Styles -->
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      var rootEl = document.getElementById('root');
      if (rootEl && (!rootEl.childNodes.length || rootEl.innerHTML.trim() === '')) {
        rootEl.innerHTML = '<div style="margin:40px auto;max-width:540px;padding:24px;background:#0f172a;border:2px solid #ef4444;border-radius:20px;color:#f8fafc;font-family:sans-serif;box-shadow:0 10px 25px rgba(0,0,0,0.5);">'
          + '<div style="font-size:32px;margin-bottom:8px;">⚠️</div>'
          + '<h2 style="margin:0 0 8px;color:#f87171;font-size:18px;font-weight:900;">アプリの読み込み中にエラーが発生しました</h2>'
          + '<p style="margin:0 0 12px;font-size:12px;color:#94a3b8;">スクリプトの実行で問題が発生しました。ブラウザのキャッシュをクリアするか、以下をクリックして初期化してください。</p>'
          + '<pre style="background:#020617;padding:12px;border-radius:12px;font-size:11px;overflow:auto;color:#fca5a5;border:1px solid rgba(239,68,68,0.3);">' + (e.message || e) + '</pre>'
          + '<div style="margin-top:16px;display:flex;gap:8px;">'
          + '<button onclick="location.reload();" style="flex:1;padding:10px 16px;background:#38bdf8;color:#0f172a;border:none;border-radius:12px;font-weight:900;cursor:pointer;">再読み込み</button>'
          + '<button onclick="localStorage.clear();location.reload();" style="flex:1;padding:10px 16px;background:#ef4444;color:white;border:none;border-radius:12px;font-weight:900;cursor:pointer;">データ初期化</button>'
          + '</div></div>';
      }
    });
  </script>
</head>
<body class="bg-slate-950 text-slate-50 antialiased selection:bg-amber-400 selection:text-slate-950">
  <div id="root"></div>

  <!-- Application Modules -->
  <script src="./js/data.js"></script>
  <script src="./js/speech.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/gemini.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
